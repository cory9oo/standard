<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habit Tracker</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="darkreader-lock">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F4F3EF">
<style>
  :root{color-scheme:light}
  html,body{margin:0;height:100%;background:#F4F3EF;color:#1A1917;
    font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{height:100%;display:grid;place-content:center;text-align:center;padding:24px;gap:10px}
  .wm{font-weight:600;letter-spacing:.02em;font-size:17px}
  .m{color:#6B6862;max-width:34ch}
  a{color:#8C2F2A}
</style>
</head>
<body>
<main>
  <div class="wm">Habit&nbsp;Tracker</div>
  <div class="m" id="m">This address has moved. Taking you to the app&hellip;</div>
  <div class="m"><a id="go" href="./v3/">Open the app</a></div>
</main>
<script>
/* TOMBSTONE — retires the legacy Apps-Script-era app (ISS-033 TWO_WRITERS_ONE_TRUTH).
   Three jobs, in this order, and the order matters:
     1. unregister ONLY the legacy service worker (scope .../standard/). The v7 worker at
        .../standard/v3/ must survive — killing it would take the live app offline-blind.
     2. delete ONLY the legacy cache ('standard-v4'). Caches are per-ORIGIN, not per-path:
        both workers' activate handlers delete every cache but their own, which is how these
        two apps have been evicting each other's offline shell. Do not touch 'standard-v7'
        or its successor.
     3. redirect to the live app.
   The legacy worker was NETWORK-FIRST, which is the only reason an installed phone can
   receive this page at all. A cache-first worker could not have been retired remotely. */
(async function(){
  var LEGACY_SCOPE = new URL('./', location.href).href;   // .../standard/
  var KEEP = /^ht-v|^standard-v7$/;                        // current + successor cache names
  try {
    if (navigator.serviceWorker) {
      var regs = await navigator.serviceWorker.getRegistrations();
      for (var i=0;i<regs.length;i++){
        if (regs[i].scope === LEGACY_SCOPE) { await regs[i].unregister(); }
      }
    }
  } catch(e){}
  try {
    var keys = await caches.keys();
    for (var j=0;j<keys.length;j++){
      if (!KEEP.test(keys[j])) { await caches.delete(keys[j]); }
    }
  } catch(e){}
  location.replace('./v3/');
})();
</script>
</body>
</html>
