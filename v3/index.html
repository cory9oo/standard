<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STANDARD</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STANDARD">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div class="wrap" id="root">
  <div class="top">
    <span class="brand">Standard</span>
    <span class="sp"></span>
    <button class="ib" id="bEdit" title="Edit the list"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
    <button class="ib" id="bSet" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9 2 2 0 11-2.7 2.7 1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6 2 2 0 11-4 0 1.7 1.7 0 00-1.1-1.6 1.7 1.7 0 00-1.9.4 2 2 0 11-2.7-2.8 1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.6-1 2 2 0 110-4 1.7 1.7 0 001.6-1.1 1.7 1.7 0 00-.4-1.9 2 2 0 112.8-2.7 1.7 1.7 0 001.9.3H10a1.7 1.7 0 001-1.6 2 2 0 114 0 1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3 2 2 0 112.7 2.8 1.7 1.7 0 00-.3 1.9v.1a1.7 1.7 0 001.6 1 2 2 0 110 4 1.7 1.7 0 00-1.6 1z"/></svg></button>
  </div>

  <section id="vToday" class="view on">
    <div class="rail" id="rail"></div>
    <div class="hero">
      <div class="ring" id="ring"></div>
      <div class="facts" id="facts"></div>
    </div>
    <div class="ready" id="ready" style="display:none"></div>
    <div id="lists"></div>
  </section>

  <section id="vLedger" class="view">
    <div class="kpis" id="kpis"></div>

    <div class="sec"><span class="t">Month</span><span class="ln"></span><span class="c" id="mLabel"></span></div>
    <div class="calnav" id="calnav"></div>
    <div class="cal" id="cal"></div>

    <div class="sec"><span class="t">Completion</span><span class="ln"></span><span class="c">by day</span></div>
    <div class="card" style="padding:14px 12px 8px"><svg class="chart" id="chart" viewBox="0 0 320 130" preserveAspectRatio="none"></svg></div>

    <div class="sec"><span class="t">Every standard</span><span class="ln"></span><span class="c">last 30 &middot; worst first</span></div>
    <div class="card" id="perHabit"></div>

    <div class="sec"><span class="t">Cost against adherence</span><span class="ln"></span><span class="c">the finding</span></div>
    <div class="card" id="costAdh"></div>

    <div class="sec"><span class="t">The ledger</span><span class="ln"></span><span class="c" id="lCount"></span></div>
    <div class="card" id="rows"></div>

    <div class="sec"><span class="t">By group</span><span class="ln"></span><span class="c">last 30</span></div>
    <div class="card" id="domain"></div>

    <div class="sec"><span class="t">Life</span><span class="ln"></span><span class="c" id="lifeC"></span></div>
    <div class="life" id="life"></div>
  </section>

  <section id="vCircle" class="view">
    <div id="circle"><div class="msg">Loading&hellip;</div></div>
  </section>
</div>

<div class="sheet" id="sheet"><div class="wrap" id="sheetBody"></div></div>
<div class="toast" id="toast">saved</div>

<nav>
  <button data-v="Today" class="on"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg><span>Today</span></button>
  <button data-v="Ledger"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 4 3 5-7"/></svg><span>Ledger</span></button>
  <button data-v="Circle"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 5.2a3.2 3.2 0 010 5.6M18.5 20a6.4 6.4 0 00-3-5.4"/></svg><span>Circle</span></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./app.js"></script>
</body>
</html>
