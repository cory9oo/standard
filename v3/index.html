<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STANDARD</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STANDARD">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="wrap">
  <div class="bar">
    <span class="id">Standard</span>
    <button id="editBtn">Edit</button>
    <span class="dt" id="dt"></span>
  </div>

  <section id="vToday" class="view on">
    <div class="hero">
      <div class="cost"><div class="v" id="cost">&mdash;</div><div class="k">Remaining today</div></div>
      <div class="score"><div class="v" id="score">&mdash;</div><div class="k" id="scoreK"></div></div>
    </div>
    <div class="trend"><div class="spark" id="spark"></div><div class="stat" id="trendStat"></div></div>
    <div id="lists"></div>
  </section>

  <section id="vLedger" class="view">
    <div class="kpi" id="kpi"></div>
    <div class="sec">Ledger</div>
    <div id="rows"></div>
    <div class="sec">By group<span class="n">last 30</span></div>
    <div id="domain"></div>
  </section>

  <section id="vCircle" class="view">
    <div id="circle"><div class="msg">Loading&hellip;</div></div>
  </section>
</div>

<div class="sheet" id="sheet"><div class="wrap" id="sheetBody"></div></div>
<div class="toast" id="toast">saved</div>

<nav>
  <button data-v="Today" class="on">Today</button>
  <button data-v="Ledger">Ledger</button>
  <button data-v="Circle">Circle</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./app.js"></script>
</body>
</html>
